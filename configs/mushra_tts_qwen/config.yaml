pages:
- type: generic
  id: intro
  name: Welcome
  content: '<h2>Synthesized-speech style listening test</h2><p>Thank you for participating. You judge how well synthesized speech clips match a <b>speaking style</b> described in text.</p><h3>What you will hear</h3><p>Each trial shows a short <b>style description</b> and several clips that all speak the <b>same sentence</b> but were produced with different settings. You rate how well each clip''s delivery matches the described style.</p><h3>Your task</h3><p>For each clip, move its slider:</p><ul><li><b>Perfect match (100)</b>: delivery matches the style perfectly.</li><li><b>Good match (75)</b>: clearly matches, with minor differences.</li><li><b>Partial match (50)</b>: some traits match, others don''t.</li><li><b>Poor match (25)</b>: mostly doesn''t match.</li><li><b>No match (0)</b>: a completely different style.</li></ul><p>Multiple clips can have similar scores.</p><h3>What is speaking style</h3><p>Speaking style is <b>how a line is said</b>, not the words. Since every clip says the same sentence, judge only the delivery. A few examples of what to listen for (there is more to notice; these are just examples):</p><ul><li><b>Emotion / tone</b>: happy, angry, sad, neutral, urgent, warm, cold, etc.</li><li><b>Pacing</b>: slow, measured, fast, rushed, with or without pauses.</li><li><b>Level of energy</b>: low and calm vs. high and excited.</li><li><b>Vocal effort</b>: whispered, soft, conversational, projected, shouted.</li></ul><p><b>A natural, believable delivery that fits the description is ideal.</b> Over-acting or exaggerating the emotion beyond what the style calls for is <b>not</b> a better match. Judge whether the delivery is <i>appropriate</i> for the style, not simply how strong or intense it is.</p><h3>Practical tips</h3><ul><li>Use <b>headphones</b> in a quiet room.</li><li>The test has <b>6 trials</b>.</li><li style=''color:#b00''><b>Do not navigate away, refresh, or close the tab during the test. Your results will be lost.</b></li></ul><p>The next page is a short <b>tutorial</b>, followed by a <b>practice trial</b> (its ratings are discarded). Click <i>Next</i> when ready.</p>'
- type: mushra
  id: trial_practice
  name: Practice
  content: <p style='color:#b00'><i>Practice round. Your ratings here are discarded.</i></p><p><b>Target speaking style:</b></p><p style='font-size:1.15em;margin-top:0'><b><i>Direct and slightly urgent, with a pleading tone. Pace is moderate, and voice carries a mix of impatience and understanding.</i></b></p><p>Every clip below speaks the <b>same sentence</b> (&ldquo;I know.  I've been in line with these people.  I understand.  I understand what it's like.  Could you please like call over and-&rdquo;). Rate how well each clip's <b>delivery</b> matches the target style above.</p>
